name: Inspect exact Android 17 source inputs

on:
  push:
    branches: [gmhub-oneui9-r8s-20261101]
    paths: ['.github/gmhub-audit-trigger.txt']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmhub-exact-inputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/prebuilts/
      - name: Free hosted-runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h .
      - name: Install extraction and tool dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            attr ccache clang cmake ninja-build pkg-config libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev libzstd-dev \
            lld protobuf-compiler build-essential python3 curl wget git-lfs \
            liblz4-dev liblz4-tool libssl-dev libxml2-utils zlib1g-dev \
            uuid-dev libfuse3-dev fuse3 f2fs-tools kmod unzip zip rsync python3-pyelftools \
            brotli patchelf imagemagick webp 7zip ffmpeg bc cpio zstd xxd file gawk
          bash scripts/internal/prepare_ci_filesystems.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - name: Identify exact tool source revisions
        id: tool-revisions
        run: echo "key=$(git rev-parse HEAD:external)" >> "$GITHUB_OUTPUT"
      - name: Cache exact host tools
        uses: actions/cache@v4
        with:
          path: out/tools
          key: r8s-audit-ubuntu24-jdk17-${{ steps.tool-revisions.outputs.key }}
      - name: Build extraction tools, not a ROM or kernel
        run: |
          # android-tools applies its pinned source patches with git am.
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          source ./buildenv.sh r8s
          ./scripts/build_dependencies.sh
      - name: Obtain only the pinned Android 17 source
        run: |
          set -eo pipefail
          source ./buildenv.sh r8s
          ./scripts/download_fw.sh --ignore-target
          ./scripts/extract_fw.sh --ignore-target
          SOURCE_DIR="$FW_DIR/$(cut -d/ -f1,2 <<< "$SOURCE_FIRMWARE" | tr / _)"
          grep -Fxq 'ro.build.version.sdk=37' "$SOURCE_DIR/system/system/build.prop"
          EXPECTED=$(cut -d/ -f1 <<< "$SOURCE_FIRMWARE_VERSION")
          grep -Fxq "ro.build.version.incremental=$EXPECTED" "$SOURCE_DIR/system/system/build.prop"
      - name: Decode exact input packages and retain native runtime containers
        run: |
          source ./buildenv.sh r8s
          SOURCE_DIR="$FW_DIR/$(cut -d/ -f1,2 <<< "$SOURCE_FIRMWARE" | tr / _)"
          python3 scripts/internal/collect_source_audit.py \
            --firmware "$SOURCE_DIR" --apktool "$TOOLS_DIR/bin/apktool.jar" \
            --out out/source-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-api37-framework-${{ github.run_id }}
          path: out/source-audit/framework.zip
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-api37-camera-${{ github.run_id }}
          path: out/source-audit/camera.zip
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-api37-systemui-${{ github.run_id }}
          path: out/source-audit/systemui.zip
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-api37-settings-${{ github.run_id }}
          path: out/source-audit/settings.zip
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-api37-biometric-${{ github.run_id }}
          path: out/source-audit/biometric.zip
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-api37-configs-tools-${{ github.run_id }}
          path: |
            out/source-audit/configs-tools.zip
            out/source-audit/manifest.json
            out/target/r8s/*.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-api37-native-display-${{ github.run_id }}
          path: out/source-audit/native-display.zip
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-api37-apex-0-${{ github.run_id }}
          path: out/source-audit/apex-0.zip
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-api37-apex-1-${{ github.run_id }}
          path: out/source-audit/apex-1.zip
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-api37-apex-2-${{ github.run_id }}
          path: out/source-audit/apex-2.zip
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-api37-apex-3-${{ github.run_id }}
          path: out/source-audit/apex-3.zip
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-api37-apex-4-${{ github.run_id }}
          path: out/source-audit/apex-4.zip
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-api37-apex-5-${{ github.run_id }}
          path: out/source-audit/apex-5.zip
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
